<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทายเลข</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Kanit', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .card {
    background: white;
    border-radius: 32px;
    padding: 40px 36px;
    width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #f093fb);
  }

  .title {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(135deg, #667eea, #f093fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .subtitle { font-size: 14px; color: #aaa; margin-bottom: 28px; }

  .range-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffd93d, #ff6b6b);
    color: white; font-weight: 700; font-size: 15px;
    padding: 8px 20px; border-radius: 50px;
    margin-bottom: 24px;
  }

  .attempts-box {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #f8f0ff; border-radius: 16px; padding: 10px 20px;
    margin-bottom: 24px;
  }

  .attempts-icon { font-size: 20px; }
  .attempts-label { font-size: 14px; color: #888; }
  .attempts-count { font-size: 22px; font-weight: 800; color: #764ba2; }

  .input-row {
    display: flex; gap: 10px; margin-bottom: 16px;
  }

  input[type=number] {
    flex: 1;
    padding: 14px 18px;
    font-size: 22px; font-family: 'Kanit', sans-serif; font-weight: 700;
    border: 3px solid #e0d0ff; border-radius: 16px;
    outline: none; text-align: center;
    transition: border-color 0.2s;
    color: #333;
  }
  input[type=number]:focus { border-color: #764ba2; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  .btn-guess {
    padding: 14px 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; font-size: 17px; font-family: 'Kanit', sans-serif; font-weight: 700;
    border: none; border-radius: 16px; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    white-space: nowrap;
  }
  .btn-guess:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.5); }
  .btn-guess:active { transform: scale(0.97); }
  .btn-guess:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .hint-box {
    min-height: 60px; display: flex; align-items: center; justify-content: center;
    border-radius: 16px; padding: 12px 20px; margin-bottom: 16px;
    font-size: 20px; font-weight: 700; transition: all 0.3s;
  }
  .hint-high { background: #fff0f0; color: #e03e3e; border: 2px solid #ffcccc; }
  .hint-low  { background: #f0f8ff; color: #2563eb; border: 2px solid #bfdbfe; }
  .hint-empty { background: #f8f8f8; color: #ccc; border: 2px solid #eee; font-size: 15px; font-weight: 400; }

  .history {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    min-height: 32px; margin-bottom: 8px;
  }
  .history-chip {
    background: #f0edff; color: #764ba2;
    font-size: 13px; font-weight: 700;
    padding: 4px 12px; border-radius: 50px;
    border: 1.5px solid #d4c9ff;
  }
  .history-chip.wrong-high { background: #fff0f0; color: #e03e3e; border-color: #ffcccc; }
  .history-chip.wrong-low  { background: #f0f8ff; color: #2563eb; border-color: #bfdbfe; }

  .btn-new {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #6bcb77, #4d96ff);
    color: white; font-size: 17px; font-family: 'Kanit', sans-serif; font-weight: 700;
    border: none; border-radius: 16px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(75,150,255,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 8px;
  }
  .btn-new:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(75,150,255,0.5); }
  .btn-new:active { transform: scale(0.97); }

  /* Win overlay */
  .win-overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(255,255,255,0.96);
    border-radius: 32px;
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 10; padding: 32px;
  }
  .win-overlay.show { display: flex; animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  .win-emoji { font-size: 72px; animation: bounce 0.6s ease infinite alternate; }
  @keyframes bounce {
    from { transform: translateY(0); }
    to   { transform: translateY(-14px); }
  }

  .win-title {
    font-size: 32px; font-weight: 800; margin: 12px 0 6px;
    background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .win-subtitle { font-size: 16px; color: #888; margin-bottom: 6px; }
  .win-number  { font-size: 48px; font-weight: 800; color: #764ba2; line-height: 1; }
  .win-label   { font-size: 16px; color: #aaa; margin-bottom: 24px; }

  /* Stars */
  .stars { display: flex; gap: 6px; margin-bottom: 20px; }
  .star { font-size: 32px; animation: spinIn 0.4s ease forwards; opacity: 0; }
  .star:nth-child(2) { animation-delay: 0.15s; }
  .star:nth-child(3) { animation-delay: 0.3s; }
  @keyframes spinIn {
    from { opacity:0; transform: scale(0) rotate(-180deg); }
    to   { opacity:1; transform: scale(1) rotate(0deg); }
  }

  /* Confetti */
  .confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 32px; }
  .confetti-piece {
    position: absolute; width: 10px; height: 10px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="confetti-container" id="confetti"></div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-emoji">🎉</div>
    <div class="win-title">เก่งมาก!</div>
    <div class="win-subtitle">คุณทายถูกแล้ว!</div>
    <div class="win-number" id="winNum"></div>
    <div class="stars">
      <span class="star">⭐</span>
      <span class="star">⭐</span>
      <span class="star">⭐</span>
    </div>
    <div class="win-label" id="winLabel"></div>
    <button class="btn-new" onclick="newGame()">🔄 เล่นใหม่อีกครั้ง</button>
  </div>

  <div class="title">🎯 ทายเลข!</div>
  <div class="subtitle">คอมสุ่มเลขไว้แล้ว... ลองทายดูสิ</div>

  <div class="range-badge">🔢 เลข 1 – 100</div>

  <div class="attempts-box">
    <span class="attempts-icon">🎲</span>
    <span class="attempts-label">ทายไปแล้ว</span>
    <span class="attempts-count" id="attemptsCount">0</span>
    <span class="attempts-label">ครั้ง</span>
  </div>

  <div class="input-row">
    <input type="number" id="guessInput" min="1" max="100" placeholder="1–100" />
    <button class="btn-guess" id="guessBtn" onclick="makeGuess()">ทาย!</button>
  </div>

  <div class="hint-box hint-empty" id="hintBox">พิมพ์ตัวเลขแล้วกด "ทาย!"</div>

  <div class="history" id="history"></div>

  <button class="btn-new" onclick="newGame()">🔄 เริ่มเกมใหม่</button>
</div>

<script>
  var secret, attempts, guesses;

  function newGame() {
    secret = Math.floor(Math.random() * 100) + 1;
    attempts = 0;
    guesses = [];
    document.getElementById('attemptsCount').textContent = '0';
    document.getElementById('hintBox').className = 'hint-box hint-empty';
    document.getElementById('hintBox').textContent = 'พิมพ์ตัวเลขแล้วกด "ทาย!"';
    document.getElementById('history').innerHTML = '';
    document.getElementById('guessInput').value = '';
    document.getElementById('guessInput').disabled = false;
    document.getElementById('guessBtn').disabled = false;
    document.getElementById('winOverlay').classList.remove('show');
    document.getElementById('confetti').innerHTML = '';
    document.getElementById('guessInput').focus();
  }

  function makeGuess() {
    var input = document.getElementById('guessInput');
    var val = parseInt(input.value);
    if (isNaN(val) || val < 1 || val > 100) {
      shake(input);
      document.getElementById('hintBox').className = 'hint-box hint-high';
      document.getElementById('hintBox').textContent = '⚠️ กรอกเลข 1–100 นะ!';
      return;
    }

    attempts++;
    document.getElementById('attemptsCount').textContent = attempts;

    var chip = document.createElement('span');
    chip.textContent = val;
    chip.className = 'history-chip';

    var hintBox = document.getElementById('hintBox');
    if (val === secret) {
      chip.className += ' ';
      document.getElementById('history').appendChild(chip);
      showWin();
    } else if (val > secret) {
      hintBox.className = 'hint-box hint-high';
      hintBox.textContent = '🔺 สูงไป! ลองต่ำกว่านี้';
      chip.className = 'history-chip wrong-high';
      document.getElementById('history').appendChild(chip);
    } else {
      hintBox.className = 'hint-box hint-low';
      hintBox.textContent = '🔻 ต่ำไป! ลองสูงกว่านี้';
      chip.className = 'history-chip wrong-low';
      document.getElementById('history').appendChild(chip);
    }
    input.value = '';
    input.focus();
  }

  function shake(el) {
    el.style.animation = 'none';
    el.style.borderColor = '#ff6b6b';
    setTimeout(function() { el.style.borderColor = ''; }, 600);
  }

  function showWin() {
    document.getElementById('guessInput').disabled = true;
    document.getElementById('guessBtn').disabled = true;
    document.getElementById('winNum').textContent = secret;
    var label = attempts === 1 ? '🏆 ครั้งเดียวเลย! อัจฉริยะ!' :
                attempts <= 5  ? '🌟 ใช้ ' + attempts + ' ครั้ง — เก่งมาก!' :
                attempts <= 10 ? '👍 ใช้ ' + attempts + ' ครั้ง — ดีมาก!' :
                                 '😊 ใช้ ' + attempts + ' ครั้ง — ไม่เป็นไร สู้ต่อไป!';
    document.getElementById('winLabel').textContent = label;
    document.getElementById('winOverlay').classList.add('show');
    spawnConfetti();
  }

  function spawnConfetti() {
    var colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#f093fb','#667eea','#ff9f43'];
    var container = document.getElementById('confetti');
    container.innerHTML = '';
    for (var i = 0; i < 60; i++) {
      (function(i) {
        setTimeout(function() {
          var p = document.createElement('div');
          p.className = 'confetti-piece';
          p.style.left = Math.random() * 100 + '%';
          p.style.background = colors[Math.floor(Math.random() * colors.length)];
          p.style.width  = (8 + Math.random() * 10) + 'px';
          p.style.height = (8 + Math.random() * 10) + 'px';
          p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
          p.style.animationDelay = '0s';
          container.appendChild(p);
        }, i * 30);
      })(i);
    }
  }

  document.getElementById('guessInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') makeGuess();
  });

  newGame();
</script>
</body>
</html>
